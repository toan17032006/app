# ══════════════════════════════════════════════════════════════════
#  PROFILE H2 — chạy app KHÔNG CẦN cài MySQL
#  Kích hoạt:  SPRING_PROFILES_ACTIVE=h2  (script start.bat/start.sh đã set sẵn)
#  Dữ liệu lưu vào file ./data/edusmart (tự tạo), giữ nguyên sau khi restart.
# ══════════════════════════════════════════════════════════════════
spring.datasource.url=${H2_URL:jdbc:h2:file:./data/edusmart;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
