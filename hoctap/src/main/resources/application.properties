spring.application.name=hoctap
server.port=${SERVER_PORT:8081}

# ══ Database (MySQL) ══════════════════════════════════════════════
# Toàn bộ tham số kết nối đều có thể ghi đè bằng biến môi trường:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# Muốn chạy KHÔNG CẦN MySQL → dùng profile H2:
#   SPRING_PROFILES_ACTIVE=h2 java -jar hoctap.jar
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edusmart?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ══ JPA / Hibernate ═══════════════════════════════════════════════
# update → Chỉ tạo bảng còn thiếu, không xóa dữ liệu cũ
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ══ JWT ═══════════════════════════════════════════════════════════
# Secret key: chuỗi ngẫu nhiên ít nhất 32 ký tự (256-bit)
# QUAN TRỌNG: khi deploy, đặt biến môi trường JWT_SECRET với giá trị riêng!
jwt.secret=${JWT_SECRET:edusmart-super-secret-key-2024-must-be-at-least-32-characters-long}
# Thời gian sống của access token (milliseconds): 24 giờ = 86400000
jwt.expiration=${JWT_EXPIRATION:86400000}
# Thời gian sống của refresh token: 7 ngày = 604800000
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ══ CORS ══════════════════════════════════════════════════════════
# Danh sách origin được phép gọi API, phân cách bằng dấu phẩy.
# Khi frontend được nhúng cùng JAR (cùng origin) thì không cần thêm gì.
# Deploy ra Internet → đặt CORS_ALLOWED_ORIGINS=https://ten-mien-cua-ban
# Hoặc mở cho mọi origin (dev/demo): CORS_ALLOWED_ORIGINS=*
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ══ Upload file bài tập ═══════════════════════════════════════════
# File học sinh nộp được lưu vào thư mục này, truy cập qua /uploads/{tên-file}
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ══ Dữ liệu mẫu (DataSeeder) ══════════════════════════════════════
# Tự tạo dữ liệu demo (user mẫu, bài thi, bài tập...) CHỈ KHI database còn trống.
# Đặt SEED_DATA=false để tắt hoàn toàn khi deploy production.
app.seed.enabled=${SEED_DATA:true}

# ══ Reset mật khẩu ════════════════════════════════════════════════
# Chưa cấu hình mail server → token reset được trả về ngay trong response
# để UI tạo link đặt lại mật khẩu. Khi có mail: app.mail.enabled=true
app.mail.enabled=${MAIL_ENABLED:false}

# ══ Spring AI — Tắt autoconfigure (chưa cần dùng AI trong project này) ══
# Tắt để tránh lỗi "API key must be set" khi khởi động
spring.ai.deepseek.chat.enabled=false
spring.ai.google.genai.chat.enabled=false
spring.ai.ollama.chat.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.GoogleGenAiChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
